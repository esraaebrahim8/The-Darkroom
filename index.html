<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Darkroom | الغرفة المظلمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =============== Tokens: light (daylight studio) =============== */
:root{
  color-scheme:light;
  --ink:#16202C; --ink2:#46566A; --line:#C3CFDC;
  --glass:rgba(255,255,255,.82); --glass-s:#FFFFFF; --paper:#FFFFFF; --paper-ink:#16202C; --kraft:#E9DDC3;
  --leaf:#C21F78; --leaf-d:#9B155C; --leaf-l:#F8DDEB; --on-leaf:#FFFFFF; --edge:#8A1250;
  --sun:#F2C200; --sun-l:#FFF3BF; --berry:#B3261E; --berry-l:#FCE1DE; --focus:#1B5FD6;
  --cy:#0A9CC2; --mg:#D62882; --yl:#F2C200; --cyl:#CDEFF7; --mgl:#FADCEB; --yll:#FFF3BF;
  --wall1:#EAF0F6; --wall2:#D4DEE9; --tile:rgba(22,32,44,.06); --glow:rgba(255,236,170,.65); --lamp:#FFD866; --night:0;
  --bench1:#9AA7B6; --bench2:#7C8A9B; --liq:#7DC9D8;
  --t1:#D6EEF5; --t2:#FADCEB; --t3:#FFF3BF; --t4:#E4E9F1;
  --shadow:0 18px 40px -20px rgba(22,32,44,.5);
  --hl:'Rubik','IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --bd:'IBM Plex Sans Arabic','Rubik',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
}
/* =============== Tokens: dark (system) =============== */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#F4EAE5; --ink2:#C4ABA6; --line:#4C2D31;
    --glass:rgba(36,17,20,.84); --glass-s:#2C181C; --paper:#F6F0E6; --paper-ink:#1A1012; --kraft:#CDB88E;
    --leaf:#FF5A47; --leaf-d:#FF8A7B; --leaf-l:#47211F; --on-leaf:#200807; --edge:#B22D20;
    --sun:#FFD84A; --sun-l:#4A3C12; --berry:#FF9C92; --berry-l:#4A1F1D; --focus:#8CC8FF;
    --cy:#35C8E8; --mg:#FF4FB0; --yl:#FFD84A; --cyl:#12414D; --mgl:#4A1B38; --yll:#4A3C12;
    --wall1:#1C0F11; --wall2:#0E0608; --tile:rgba(255,120,100,.05); --glow:rgba(255,50,40,.42); --lamp:#FF3B2F; --night:1;
    --bench1:#3A2A2D; --bench2:#271A1D; --liq:#2B6F7D;
    --t1:#12414D; --t2:#4A1B38; --t3:#4A3C12; --t4:#2E2326;
    --shadow:0 18px 40px -20px rgba(0,0,0,.9);
  }
}
/* =============== Tokens: dark (manual) =============== */
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F4EAE5; --ink2:#C4ABA6; --line:#4C2D31;
  --glass:rgba(36,17,20,.84); --glass-s:#2C181C; --paper:#F6F0E6; --paper-ink:#1A1012; --kraft:#CDB88E;
  --leaf:#FF5A47; --leaf-d:#FF8A7B; --leaf-l:#47211F; --on-leaf:#200807; --edge:#B22D20;
  --sun:#FFD84A; --sun-l:#4A3C12; --berry:#FF9C92; --berry-l:#4A1F1D; --focus:#8CC8FF;
  --cy:#35C8E8; --mg:#FF4FB0; --yl:#FFD84A; --cyl:#12414D; --mgl:#4A1B38; --yll:#4A3C12;
  --wall1:#1C0F11; --wall2:#0E0608; --tile:rgba(255,120,100,.05); --glow:rgba(255,50,40,.42); --lamp:#FF3B2F; --night:1;
  --bench1:#3A2A2D; --bench2:#271A1D; --liq:#2B6F7D;
  --t1:#12414D; --t2:#4A1B38; --t3:#4A3C12; --t4:#2E2326;
  --shadow:0 18px 40px -20px rgba(0,0,0,.9);
}
/* =============== Base =============== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0E0608}
html{-webkit-text-size-adjust:100%}
html[lang="ar"]{font-size:106%}
body{font-family:var(--bd);font-size:1rem;line-height:1.55;color:var(--ink)}
[dir="rtl"] body{line-height:1.8}
h1,h2,h3{font-family:var(--hl);line-height:1.2;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
/* =============== World (darkroom scene) =============== */
.world{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip;isolation:isolate;background:linear-gradient(180deg,var(--wall1),var(--wall2))}
.tiles{position:absolute;inset:0;z-index:0;background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:72px 72px}
.glow{position:absolute;z-index:0;inset:-10% -10% 30% 40%;background:radial-gradient(closest-side,var(--glow),transparent 72%);animation:pulse 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes pulse{from{opacity:.75}to{opacity:1}}
.lamp{position:absolute;z-index:1;top:calc(env(safe-area-inset-top,0px) + 70px);inset-inline-end:7%;width:30px;height:46px;pointer-events:none}
.lamp i{position:absolute;left:50%;top:0;width:2px;height:16px;background:var(--ink2);transform:translateX(-50%)}
.lamp b{position:absolute;left:0;right:0;bottom:0;height:30px;border-radius:50% 50% 45% 45%;background:var(--lamp);box-shadow:0 0 26px 10px var(--glow),0 0 90px 36px var(--glow)}
.motes{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:var(--night)}
.motes i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#FFB3A8;opacity:.0;animation:mote 14s linear infinite}
.motes i:nth-child(1){left:62%;animation-delay:-2s}.motes i:nth-child(2){left:70%;animation-delay:-5s}.motes i:nth-child(3){left:78%;animation-delay:-8s}.motes i:nth-child(4){left:85%;animation-delay:-1s}
.motes i:nth-child(5){left:54%;animation-delay:-10s}.motes i:nth-child(6){left:92%;animation-delay:-6s}.motes i:nth-child(7){left:46%;animation-delay:-12s}.motes i:nth-child(8){left:66%;animation-delay:-3s}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(-40px,-100vh);opacity:0}}
.clothes{position:absolute;z-index:1;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);height:110px;pointer-events:none}
.clothes svg.rope{position:absolute;inset:0;width:100%;height:30px}
.clothes .rope path{fill:none;stroke:var(--ink2);stroke-width:2;opacity:.7}
.hang{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:space-around;padding:0 4%}
.hp{width:clamp(44px,5.4vw,70px);aspect-ratio:4/5;transform-origin:50% 0;animation:swing 5s ease-in-out infinite alternate;position:relative;background:var(--paper);border-radius:2px;box-shadow:0 6px 12px -4px rgba(0,0,0,.45);padding:3px 3px 8px}
.hp::before{content:"";position:absolute;left:50%;top:-8px;width:8px;height:16px;background:var(--sun);border-radius:2px;transform:translateX(-50%)}
.hp:nth-child(2n){animation-duration:6.4s;animation-delay:-2s}.hp:nth-child(3n){animation-duration:4.4s;animation-delay:-1s}
@keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.hp .mini{width:100%;height:100%;background:#fff;overflow:hidden}
.hp .mini svg{width:100%;height:100%}
.hp.blank{background:#2a1c1e;opacity:.55}.hp.blank .mini{background:transparent}
.hp.soft .mini{filter:blur(1.4px) saturate(.7)}
@media (max-width:760px),(max-height:620px){.clothes,.lamp{display:none}}
.bench{position:absolute;z-index:1;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,var(--bench1),var(--bench2));box-shadow:0 -4px 0 rgba(255,255,255,.08) inset;pointer-events:none}
.bench .tr{position:absolute;bottom:56px;width:120px;height:26px;border-radius:6px 6px 0 0;background:var(--bench1);border:3px solid var(--bench2)}
.bench .tr::after{content:"";position:absolute;inset:3px 4px auto 4px;height:10px;border-radius:3px;background:var(--liq);opacity:.8;animation:slosh 4s ease-in-out infinite alternate}
@keyframes slosh{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.bench .tr:nth-child(1){inset-inline-start:4%}.bench .tr:nth-child(2){inset-inline-start:calc(4% + 140px)}
.bench .bt{position:absolute;bottom:56px;width:22px;height:48px;border-radius:5px 5px 2px 2px;background:var(--leaf);opacity:.75}
.bench .bt:nth-of-type(3){inset-inline-end:6%}.bench .bt:nth-of-type(4){inset-inline-end:calc(6% + 34px);background:var(--cy);height:36px}
@media (max-width:760px){.bench{display:none}}
#view{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
/* =============== HUD =============== */
.hud{position:relative;z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hl);font-weight:800;font-size:1.2rem;white-space:nowrap;color:var(--ink);background:var(--glass);padding:5px 14px 5px 6px;border-radius:999px;backdrop-filter:blur(10px)}
[dir="rtl"] .brand{padding:5px 6px 5px 14px}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center}
.hudc{display:flex;align-items:center;gap:12px;background:var(--glass);padding:6px 14px;border-radius:999px;backdrop-filter:blur(10px);min-height:44px;max-width:100%}
.hudc:empty{display:none}
.hudc .rt{font-family:var(--hl);font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeds{display:flex;gap:4px;align-items:center}
.seed{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);display:block;transition:background .4s,transform .4s}
.seed:nth-child(4n+1):not(:first-child){margin-inline-start:7px}
.seed.ok{background:var(--leaf);border-color:var(--leaf)}
.seed.re{background:var(--sun);border-color:var(--sun)}
.seed.cur{border-color:var(--ink);transform:scale(1.25)}
.controls{display:flex;gap:6px}
.ib{display:inline-grid;place-items:center;min-width:44px;min-height:44px;padding:0 10px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(10px);cursor:pointer;color:var(--ink);transition:transform .12s,background .12s}
.ib.txt{border-radius:999px;font-weight:500;font-size:.92rem}
.ib:hover{background:var(--glass-s)}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px}
.ib .off{display:none}.ib[aria-pressed="true"] .on{display:none}.ib[aria-pressed="true"] .off{display:block}
.theme-ic-moon{display:block}.theme-ic-sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-ic-moon{display:none}:root:not([data-theme="light"]) .theme-ic-sun{display:block}}
:root[data-theme="dark"] .theme-ic-moon{display:none}
:root[data-theme="dark"] .theme-ic-sun{display:block}
@media (max-width:640px){.hudc .rn{display:none}.hudc{order:3;width:100%;justify-content:center}.brand .nm{display:none}.brand{padding:5px}}

#view{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
.bubble,.view-anim{animation:viewin .6s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* =============== Buttons =============== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:18px;border:0;background:var(--leaf);color:var(--on-leaf);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 var(--edge);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btn[disabled]{opacity:.5;cursor:default;filter:none;transform:none;box-shadow:0 5px 0 var(--edge)}
.btn svg{width:20px;height:20px}
.btn.alt{background:var(--glass-s);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{min-height:44px;padding:0 18px;font-size:.95rem;border-radius:14px}
button.linklike{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;font-size:.95rem}
button.linklike:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* overlay cards */
.ov{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(6,20,17,.45);backdrop-filter:blur(6px);animation:fadein .4s ease both;overflow:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovc{width:min(560px,100%);background:var(--paper);color:var(--paper-ink);border-radius:28px;padding:26px 26px 28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:jin2 .6s cubic-bezier(.34,1.4,.64,1) both;text-align:start}
@keyframes jin2{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.ovc .big{font-family:var(--hl);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;color:var(--leaf-d)}
html:not([data-theme="dark"]) .ovc h2{color:#12302A}
.ovc h2{font-size:1.9rem;margin-top:6px;color:#12302A}
.ovc p.rule{margin-top:12px;font-size:1.08rem;max-width:34em}
.ovc .btn{margin-top:22px}
.ovc .sc{margin-top:6px;font-size:1.1rem;font-weight:500}
.sumlist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.sumlist li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid #E2D7B8}
.sumlist .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.sumlist .st svg{width:18px;height:18px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.st.ok{background:#1E7A4C}.st.ok svg{stroke:#fff}
.st.re{background:#F5B73C}.st.re svg{stroke:#3A2A00}
.sumlist .nm{font-weight:600}.sumlist .sub{font-size:.85rem;color:#3A574F}
.sumlist .rs{font-size:.85rem;color:#3A574F;text-align:end}
.remember{margin-top:16px;padding:12px 16px;border-radius:16px;background:#FFF1CC;color:#12302A}
.remember h3{font-size:1.02rem;margin-bottom:2px}

/* =============== Dialogs (About deck / Stages guide) =============== */
dialog{padding:0;border:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(4,14,12,.7);backdrop-filter:blur(5px)}
dialog.deck{width:min(1120px,96vw);height:min(760px,94dvh);margin:auto}
dialog.sheet{width:min(960px,96vw);max-height:94dvh;margin:auto}
.dk{display:flex;flex-direction:column;height:100%;max-height:94dvh;background:var(--glass-s);border-radius:30px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.7);border:1px solid var(--line)}
.dkbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px}
.dkbar .tt{font-family:var(--hl);font-weight:700;font-size:1.05rem}
.dkslides{flex:1;min-height:0;overflow:auto;padding:6px 26px 14px}
.dkfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line)}
.pgs{display:flex;gap:8px;align-items:center}
.pgs button{all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.pgs button::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .25s}
.pgs button[aria-current="true"]::before{width:30px;border-radius:8px;background:var(--leaf)}
.pgs button:focus-visible{outline:3px solid var(--focus)}
.sl{display:grid;gap:22px;align-items:center;min-height:100%;animation:viewin .45s ease both}
@media (min-width:860px){.sl{grid-template-columns:1fr 1.15fr;gap:40px}.sl.one{grid-template-columns:1fr}}
.sl h2{font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.1}
.sl .kick{font-size:.95rem;font-weight:600;color:var(--leaf-d);margin-bottom:6px}
:root[data-theme="dark"] .sl .kick{color:var(--leaf)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sl .kick{color:var(--leaf)}}
.sl p.t{font-size:1.1rem;margin-top:12px;max-width:34em;color:var(--ink)}
.sl .note{margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--sun-l);font-size:.93rem;max-width:36em}
.vis{display:flex;align-items:center;justify-content:center;min-width:0}
.facts{display:grid;gap:8px;margin-top:16px;max-width:30em}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:8px 14px;border-radius:14px;background:var(--leaf-l)}
.facts b{font-weight:600}
.pair{display:flex;gap:10px;align-items:flex-end;justify-content:center;--pw:clamp(90px,18vw,170px)}
.pair .mid{display:grid;place-items:center;gap:6px;padding-bottom:50px}
.pair .mid .ico{width:56px;height:56px;border-radius:50%;background:var(--t1);display:grid;place-items:center}
.pair .mid .ico svg{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.model{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.mc{min-width:0;overflow:hidden;display:grid;gap:8px;padding:12px 10px;border-radius:18px;background:var(--tc);align-content:start}
.mc h4{margin:0;font-family:var(--hl);font-size:.98rem;line-height:1.2}
.mc .bl{font-size:.74rem;display:grid;gap:3px}
.bar{display:flex;gap:3px;min-width:0}.bar i{flex:1 1 0;min-width:0;height:8px;border-radius:4px;background:rgba(0,0,0,.14)}.bar i.on{background:var(--ink)}
.mc .sty{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;margin-top:4px}
.mc .sty span.ico{width:30px;height:30px;border-radius:50%;background:var(--glass-s);display:grid;place-items:center;flex:none}
.mc .sty svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.model .mc:nth-child(1){--tc:var(--t1)}.model .mc:nth-child(2){--tc:var(--t2)}.model .mc:nth-child(3){--tc:var(--t3)}.model .mc:nth-child(4){--tc:var(--t4)}
@media (max-width:640px){.model{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 11px;text-align:start;vertical-align:top}
.tbl th{background:var(--leaf-l)}
.tw{overflow-x:auto;width:100%}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:14px}
.fn{padding:8px 14px;border-radius:14px;background:var(--leaf-l);font-weight:600;font-size:.92rem}
.legend{display:grid;gap:10px;width:100%}
.lg{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;padding:8px 12px;border-radius:18px;background:var(--leaf-l)}
.lg .pair{--pw:70px;gap:2px}
.lg p{font-size:.95rem}
.dl{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none;max-width:40em}
.dl li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 14px;border-radius:16px;background:var(--leaf-l)}
.dl .ico{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.cols3{display:grid;gap:12px;margin-top:14px}
@media (min-width:760px){.cols3{grid-template-columns:repeat(3,1fr)}}
.cols3>div{padding:14px 16px;border-radius:18px;background:var(--leaf-l)}
.cols3 h3{font-size:1.05rem;margin-bottom:4px}
.cols3 ul{margin:4px 0 0;padding-inline-start:20px}.cols3 li{margin:3px 0;font-size:.95rem}
.two{display:grid;gap:14px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.two>div{padding:14px 16px;border-radius:18px;background:var(--leaf-l)}
.two h3{font-size:1.05rem;margin-bottom:4px}.two ul{margin:4px 0 0;padding-inline-start:20px}.two li{margin:4px 0;font-size:.95rem}
.two>div.warn{background:var(--sun-l)}

.cap{margin-top:8px;display:inline-flex;gap:8px;align-items:center;background:var(--kraft);color:#2a2418;padding:4px 14px;border-radius:4px;font-weight:600;font-size:.9rem;box-shadow:0 2px 0 rgba(0,0,0,.2);transform:rotate(-.8deg);max-width:100%}

@keyframes rock{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-1.6deg) translateY(4px)}45%{transform:rotate(1.6deg) translateY(-2px)}70%{transform:rotate(-1deg) translateY(3px)}}

.lb.c i{background:var(--cy)}.lb.m i{background:var(--mg)}.lb.y i{background:var(--yl)}
/* =============== Develop panel =============== */

.sent .seg-s,.sent .seg-b,.sent .seg-i{color:#16202C}
.sent .seg-s{background:#CDEFF7}.sent .seg-b{background:#FADCEB}.sent .seg-i{background:#FFF3BF}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.opt[aria-disabled="true"]{opacity:.5;cursor:default;box-shadow:none}
.opt .tg{display:inline-block;margin-inline-start:8px;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--berry-l);color:var(--berry);vertical-align:middle}
.actions{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.res{display:grid;gap:8px;margin-top:12px}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:16px;animation:bubin2 .4s ease both}

.rrow.ok{background:var(--leaf-l)}.rrow.bad{background:var(--berry-l)}

.rrow[data-k="s"] .bd{background:var(--cy)}.rrow[data-k="b"] .bd{background:var(--mg);color:#fff}.rrow[data-k="i"] .bd{background:var(--yl)}
.rrow h3{font-size:1rem}.rrow p{font-size:.95rem;max-width:46em}
.rrow .st{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;margin-bottom:2px}

.note{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--sun-l);font-size:.93rem}
/* =============== Retouch =============== */
.card{position:relative;width:min(100%,560px);padding:22px 22px 24px;border-radius:6px;background:var(--paper);color:var(--paper-ink);box-shadow:0 24px 40px -20px rgba(0,0,0,.7);transform:rotate(-.6deg);font-size:1.2rem;line-height:2.1}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,216,74,.8);border-radius:3px}

@keyframes wob2{0%,100%{translate:0}25%{translate:-4px}75%{translate:4px}}
.card .stamp{position:absolute;inset-inline-end:14px;top:10px;font-family:var(--hl);font-weight:800;color:#E5322D;border:3px solid #E5322D;border-radius:6px;padding:0 8px;transform:rotate(6deg);opacity:.8;font-size:.85rem}
.rw{display:grid;gap:8px;margin-top:12px}
.lt{position:relative;width:min(100%,620px);padding:38px 22px 30px;border-radius:20px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 30px),radial-gradient(circle at 50% 35%,rgba(255,255,255,.28),rgba(255,255,255,.05));border:2px solid var(--line);display:grid;place-items:center}

/* =============== Conversation =============== */
.scene2{position:relative;width:min(100%,520px);height:100%;min-height:200px;display:flex;align-items:flex-end;justify-content:center}
.office{position:absolute;inset:6% 4% 0 4%;border-radius:22px 22px 0 0;background:linear-gradient(180deg,var(--cyl),var(--glass-s));border:2px solid var(--line);overflow:hidden}
.office::before{content:"";position:absolute;inset-inline-start:8%;top:12%;width:26%;height:30%;border-radius:6px;border:4px solid var(--cy);opacity:.6}
.office::after{content:"";position:absolute;inset-inline-end:8%;bottom:0;width:30%;height:26%;background:var(--bench1);border-radius:8px 8px 0 0;opacity:.8}
.av{position:relative;z-index:2;height:100%;max-height:340px;aspect-ratio:200/250}
.av svg{width:100%;height:100%;overflow:visible}

.av[data-pose="open"] .head,.av[data-pose="happy"] .head{animation:nod 2.4s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg) translateY(2px)}60%{transform:rotate(-1deg)}}
.av[data-pose="closed"] .head,.av[data-pose="defensive"] .head{animation:sh 3.2s ease-in-out infinite}
@keyframes sh{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-3deg)}94%{transform:rotate(3deg)}}

@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.say2{position:absolute;z-index:4;top:0;inset-inline-start:50%;transform:translateX(-50%);width:max-content;max-width:min(94%,440px);background:#fff;color:#16202C;border-radius:20px;padding:10px 16px 12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);font-size:1.02rem;line-height:1.5;animation:bubin .45s cubic-bezier(.34,1.56,.64,1) both}

.lamps{position:absolute;z-index:3;inset-inline-start:2%;bottom:8%;display:grid;gap:6px;justify-items:center;background:var(--glass);padding:8px 8px;border-radius:14px}

.you{margin:0 0 10px;padding:8px 14px;border-radius:14px 14px 14px 4px;background:var(--leaf-l);font-size:.95rem}

/* =============== Your turn =============== */
.fld{margin-top:12px}

.hits{display:grid;gap:4px;margin-top:6px}

.cb{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--glass-s);border:1px solid var(--line);cursor:pointer;font-size:.95rem}

.index{width:min(100%,520px);padding:18px 18px 20px;border-radius:6px;background:var(--paper);color:var(--paper-ink);box-shadow:0 24px 40px -20px rgba(0,0,0,.7);transform:rotate(.6deg);font-size:1.12rem;line-height:1.9;position:relative;min-height:150px}
.index::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(3deg);background:rgba(255,216,74,.8);border-radius:3px}

/* =============== Camera test (lab) =============== */
.vf{position:relative;width:min(100%,520px);aspect-ratio:4/3;display:grid;place-items:center;border-radius:12px;background:#0b0708;overflow:hidden;box-shadow:0 24px 40px -20px rgba(0,0,0,.8)}
.vf::before,.vf::after{content:"";position:absolute;inset:14px;border:0;pointer-events:none;background:
 linear-gradient(#fff,#fff) top left/26px 3px no-repeat,linear-gradient(#fff,#fff) top left/3px 26px no-repeat,
 linear-gradient(#fff,#fff) top right/26px 3px no-repeat,linear-gradient(#fff,#fff) top right/3px 26px no-repeat,
 linear-gradient(#fff,#fff) bottom left/26px 3px no-repeat,linear-gradient(#fff,#fff) bottom left/3px 26px no-repeat,
 linear-gradient(#fff,#fff) bottom right/26px 3px no-repeat,linear-gradient(#fff,#fff) bottom right/3px 26px no-repeat;opacity:.8}
.vf::after{inset:0;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.55));opacity:1}

@keyframes blink2{50%{opacity:.2}}
.stmt{position:relative;z-index:2;font-family:var(--hl);font-weight:700;font-size:clamp(1.6rem,5vw,2.6rem);color:#fff;text-align:center;padding:0 30px;animation:bubin .4s ease both}

@keyframes flash{0%{background-color:#fff}100%{background-color:transparent}}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.yn .btn{min-height:64px;flex-direction:column;gap:2px;font-size:1rem}
.yn small{font-weight:400;font-size:.8rem;opacity:.9}
.prog{display:flex;gap:6px;margin-top:6px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}.prog i.ok{background:var(--cy)}.prog i.re{background:var(--yl)}
.prog i.cur{background:var(--ink2)}
.exp{display:grid;gap:10px;margin-top:12px}
.step{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;border:2px solid var(--line);background:var(--glass-s);cursor:pointer;box-shadow:0 3px 0 var(--line);font-weight:600}
.step:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.step[aria-disabled="true"]{opacity:.55;cursor:default}
.step .dotc{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#16202C;font-family:var(--hl);font-weight:800}
.step[data-k="s"] .dotc{background:var(--cy)}.step[data-k="b"] .dotc{background:var(--mg);color:#fff}.step[data-k="i"] .dotc{background:var(--yl)}
.step.done{background:var(--paper);color:var(--paper-ink);cursor:default;opacity:1}

/* =============== Cover / final =============== */
.cover{flex:1 1 auto;min-height:0;display:grid;gap:14px;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 18px);align-items:center;overflow:auto}
@media (min-width:900px){.cover{grid-template-columns:1fr 1fr;gap:40px;padding:0 6vw 56px}}
.ctext{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.ctext h1{font-size:clamp(2.8rem,10vw,6.2rem);font-weight:800;line-height:.98;letter-spacing:-.01em;position:relative}
[dir="rtl"] .ctext h1{line-height:1.2;letter-spacing:0}
:root:not([data-theme="dark"]) .ctext h1{text-shadow:3px 0 0 var(--cy),-3px 0 0 var(--mg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ctext h1{text-shadow:0 0 18px var(--glow),0 0 50px var(--glow)}}
:root[data-theme="dark"] .ctext h1{text-shadow:0 0 18px var(--glow),0 0 50px var(--glow)}
.ctext .lead{font-size:clamp(1.02rem,2.4vw,1.28rem);max-width:30em;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.meta{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink2)}
.meta svg{width:18px;height:18px}
.cover .easel{margin-inline:auto}
.flashov{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;animation:fl .5s ease both}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.fsum{display:grid;gap:14px;max-width:1100px;margin:0 auto}
@media (min-width:900px){.fsum{grid-template-columns:1fr 1fr;gap:18px 26px}.fsum .full{grid-column:1/-1}}
.finalv{overflow:auto;padding-top:6px}
@media (min-width:761px) and (min-height:621px){.finalv{padding-top:112px}}
.fcard{background:var(--glass);backdrop-filter:blur(14px);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.fcard h2{font-size:clamp(1.8rem,5vw,2.6rem)}.fcard h3{font-size:1.2rem}
.bigscore{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.bigscore .n{font-family:var(--hl);font-weight:800;font-size:4rem;line-height:1;color:var(--leaf-d)}
.bigscore .o{font-size:1.1rem;color:var(--ink2)}
.msg{font-size:1.08rem;margin-top:6px;max-width:32em}
.sheet4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.fr4{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:6px 6px 8px;box-shadow:0 8px 16px -8px rgba(0,0,0,.5);text-align:center;font-size:.78rem;font-weight:600}
.fr4 .im{aspect-ratio:4/3;background:#fff;overflow:hidden;margin-bottom:4px;display:grid;place-items:center}
.fr4 .im svg{width:100%;height:100%}
.fr4.soft .im{filter:blur(1.6px) saturate(.7)}
@media (max-width:560px){.sheet4{grid-template-columns:repeat(2,1fr)}}
.bys{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.bys li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:16px;background:var(--glass-s);border:1px solid var(--line)}
.bys b{font-weight:600;display:block}.bys small{color:var(--ink2);font-size:.84rem}
.dots{display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.dot svg{width:15px;height:15px;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.dot.ok{background:var(--cy)}.dot.ok svg{stroke:#16202C}
.dot.re{background:var(--yl)}.dot.re svg{stroke:#16202C}
.three{margin:10px 0 0;padding-inline-start:22px}.three li{margin:6px 0;max-width:34em}
.count{font-size:.9rem;color:var(--ink2)}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .glow,.motes,.hp{animation:none}
}

  var t = T(), sl = slides(), n = sl.length; S.slide = Math.max(0, Math.min(n - 1, S.slide));
  $('#dlg').setAttribute('aria-label', t.about);
  $('#dlg').innerHTML = '<div class="dk"><div class="dkbar"><span class="tt">' + t.about + '</span><button type="button" class="ib" data-act="closeDlg" aria-label="' + t.close + '">' + IC.close + '</button></div><div class="dkslides" id="dkslides" tabindex="-1" aria-live="polite">' + sl[S.slide] + '</div>' +
    '<div class="dkfoot"><button type="button" class="btn alt sm" data-act="dprev"' + (S.slide === 0 ? ' disabled' : '') + ' data-focus>' + IC.prev + t.prev + '</button><div class="pgs" role="group" aria-label="' + fmt(t.slideOf, { a: S.slide + 1, b: n }) + '">' + sl.map(function (x, i) { return '<button type="button" data-act="dgo" data-i="' + i + '"' + (i === S.slide ? ' aria-current="true"' : '') + ' aria-label="' + fmt(t.slideOf, { a: i + 1, b: n }) + '"></button>'; }).join('') + '</div><button type="button" class="btn sm" data-act="dnext"' + (S.slide === n - 1 ? ' disabled' : '') + '>' + t.next + IC.arrow + '</button></div></div>';
}
function renderCheat() {
  var t = T(); $('#dlg').setAttribute('aria-label', t.cheatT);
  $('#dlg').innerHTML = '<div class="dk"><div class="shead"><h2>' + t.cheatT + '</h2><button type="button" class="ib" data-act="closeDlg" aria-label="' + t.close + '" data-focus>' + IC.close + '</button></div><div class="sbody">' + cheatHTML() + '</div></div>';
}

/* =====================================================
   Navigation + events
   ===================================================== */
function setView(v) { S.view = v; S.ov = null; render(true); }
function beginRound(r) { S.round = r; S.ov = 'intro'; S.view = 'play'; render(false); }
function render(focusTitle) {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = S.lang === 'ar' ? 'الغرفة المظلمة | The Darkroom' : 'The Darkroom | الغرفة المظلمة';
  clearInterval(coverTimer); renderClothes();
  if (S.view === 'cover') { renderHud(); renderCover(); }
  else if (S.view === 'lab') { renderHud(); renderLab(); }
  else if (S.view === 'play') renderPlay();
  else { renderHud(); renderFinal(); }
  if (focusTitle) { var h = $('#pageTitle'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } } }
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), idx = +b.getAttribute('data-idx');
  switch (a) {
    case 'start': doStart(); break;
    case 'about': openDlg('about'); break;
    case 'labdev': labDev(i); break;
    case 'labcam': S.lab.step = 2; Snd.sfx('card'); renderLab(); { var f = $('[data-act=cam]'); if (f) f.focus(); } break;
    case 'cam': camAnswer(+b.getAttribute('data-v')); break;
    case 'camnext': camNext(); break;
    case 'labgo': beginRound(1); Snd.sfx('round'); break;
    case 'go': S.ov = null; Snd.sfx('pop'); renderOv(); { var ff = $('#panel .opt:not([aria-disabled]),#panel .ph-chip,#panel textarea,#panel .tab'); if (ff && S.round !== 2) { try { ff.focus({ preventScroll: true }); } catch (er) { ff.focus(); } } } break;
    case 'tab': S.devTab = b.getAttribute('data-k'); Snd.sfx('pop'); renderDevPanel(); { var tt = $('.tab[aria-selected="true"]'); if (tt) tt.focus(); } break;
    case 'opt': pickOpt(idx); break;
    case 'develop': developNow(); break;
    case 'reexpose': reexpose(); break;
    case 'devnext': devNext(); break;
    case 'chip': retChip(i); break;
    case 'retcheck': retCheck(); break;
    case 'rw': retRw(idx); break;
    case 'retnext': retNext(); break;
    case 'conv': convPick(idx); break;
    case 'convnext': convNext(); break;
    case 'copycard': copyCard(); break;
    case 'myfinish': S.cur = -1; S.view = 'final'; S.ov = null; Snd.sfx('shutter'); render(true); break;
    case 'nextRound': S.ov = null; beginRound(S.round + 1); Snd.sfx('round'); break;
    case 'replay': clearInterval(finalTimer); S = freshState({ lang: S.lang }); render(true); break;
    case 'guideOpen': openDlg('guide'); break;
    case 'closeDlg': $('#dlg').close(); break;
    case 'dprev': S.slide--; renderDeck(); { var f1 = $('#dlg .dkfoot .btn:not([disabled])'); if (f1) f1.focus(); } break;
    case 'dnext': S.slide++; renderDeck(); { var f2 = $('#dlg .dkfoot .btn:not([disabled]):last-child'); if (f2) f2.focus(); } break;
    case 'dgo': S.slide = i; renderDeck(); { var f3 = $('#dlg .pgs [aria-current="true"]'); if (f3) f3.focus(); } break;
  }
});
document.addEventListener('input', function (e) {
  var ta = e.target.closest && e.target.closest('textarea[data-k]'); if (ta) { S.my[ta.getAttribute('data-k')] = ta.value; updateHits(); return; }
  var cb = e.target.closest && e.target.closest('input[data-chk]'); if (cb) { S.myChk[+cb.getAttribute('data-chk')] = cb.checked; Snd.sfx('pop'); }
});
document.addEventListener('keydown', function (e) {
  var d = $('#dlg');
  if (d.open && S.dlg === 'about' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    var fwd = (e.key === 'ArrowRight') === (S.lang !== 'ar'), n = slides().length;
    if (fwd && S.slide < n - 1) { S.slide++; renderDeck(); } else if (!fwd && S.slide > 0) { S.slide--; renderDeck(); }
    var f = $('#dlg .pgs [aria-current="true"]'); if (f) f.focus(); e.preventDefault();
  }
  if (S.view === 'lab' && S.lab.step === 2 && !S.lab.camDone && S.lab.camAns === null && !d.open && !(e.target.closest && e.target.closest('input,textarea'))) {
    if (e.key === 'y' || e.key === 'Y') camAnswer(1); else if (e.key === 'n' || e.key === 'N') camAnswer(0);
  }
});
$('#bSound').addEventListener('click', function () { Snd.init(); Snd.setOn(!Snd.on); store('tg.snd', Snd.on ? '1' : '0'); renderHud(); if (Snd.on) Snd.sfx('pop'); });
$('#bTheme').addEventListener('click', function () { var next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('tg.theme', next); renderHud(); });
$('#bLang').addEventListener('click', function () { S.lang = S.lang === 'en' ? 'ar' : 'en'; store('tg.lang', S.lang); var open = $('#dlg').open, mode = S.dlg; render(false); if (open) { if (mode === 'about') renderDeck(); else renderCheat(); } });
$('#bGuide').addEventListener('click', function () { openDlg('guide'); });
$('#bAbout').addEventListener('click', function () { openDlg('about'); });
$('#dlg').addEventListener('click', function (e) { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden && Snd.ctx) Snd.resume(); });

var sv = store('tg.theme'); if (sv === 'dark' || sv === 'light') document.documentElement.setAttribute('data-theme', sv);
if (store('tg.snd') === '0') Snd.on = false;
S = freshState(); FX.init(); render(false);
})();
</script>
</body>
</html>
